# ======================= KANAL KİMLİĞİ =======================
# Niş: Education & Science (2026 verisinde en yüksek medyan RPM'li kategori)
channel_name: "Cutaway"        # kanal adını değiştirirsen burayı da değiştir
notify_prefix: "🔧 Cutaway |"   # Telegram mesajlarında hangi kanal olduğu
channel_brief: >
  Science and engineering behind everyday things and
  giant systems. Each video takes ONE thing (a jet engine, a dam, GPS, a
  refrigerator, a container port, a nuclear reactor, why glass is transparent)
  and explains how it works, step by step, with a surprising "aha" moment.
  Also covers the cost/economics side when it helps understanding. No real
  people as main subjects, no investment/medical/legal advice, no politics,
  no current news (content must stay true for years).
audience: "curious adults 18-55 in the US, UK, Canada, Australia"
tone: "calm documentary narrator, clear, curious, occasional dry humor"
language: "English"
language_code: "en"

script_rules: >
  HOOK (first 2-3 sentences): show the subject and state the surprising outcome or
  question right away so the viewer knows they clicked the right video; no
  greetings, no "in today's video", no clichés ("did you know", "imagine",
  "from sand to smartphone"), no fake suspense that withholds basic info.
  Preview the payoff early, then deliver it. Structure the video in clear
  chapters; each chapter answers one question. Explain like a great teacher:
  one idea per scene, define a term right before using it, everyday analogies,
  concrete examples, scale comparisons; every claim gets a visual proof (a
  diagram or footage that shows it). Change the angle when the information
  changes (claim → evidence → consequence). Only well-established science and
  engineering facts; if a number is uncertain give a range or say "roughly".
  Use signposts sparingly. No filler, no "smash the like button", no clickbait
  the video doesn't deliver. End with a one-line takeaway. Do NOT add a
  sign-off, greeting or "subscribe" line — the channel's fixed closing line is
  added automatically.

content_pillars:
  - "How a machine or device works, from the inside (engines, fridges, batteries, phones)"
  - "Giant infrastructure explained (power grids, dams, ports, bridges, internet cables)"
  - "Everyday science mysteries (why ice floats, why the sky is blue, how soap works)"
  - "How it's made and what it really costs (steel, glass, chips, paper, concrete)"

# Kanalın görsel kimliği: her diyagram bu stilde üretilir → tutarlı marka görünümü
visual_style: >
  clean modern educational illustration, cutaway / cross-section where useful,
  flat vector look with soft gradients, dark navy background, glowing cyan and
  warm orange accents, clear arrows showing flow, no text or labels, 16:9
thumbnail_style: "bold, high contrast, dramatic lighting, one clear object, cinematic, vivid colors"

# Kanal sayfası (ilk gerçek çalışmada bir kez otomatik ayarlanır)
branding:
  version: 2                   # afiş/açıklama değişince artır → bir sonraki çalışmada kanala yeniden uygulanır
  banner: "assets/cutaway_banner.jpg"
  country: "TR"
  keywords: "how things work engineering science explained infrastructure machines education cutaway"
  description: >
    How things actually work. Cutaway takes one everyday thing or giant system —
    a jet engine, a power grid, a container port, a fridge — and explains how it
    really works, step by step, with clear diagrams and real footage.
    New videos every Monday, Wednesday and Friday.
    Narration uses an AI voice; every script is fact-checked before publishing.

made_for_kids: false
declare_synthetic: true        # AI içerik beyanı (YouTube politikası)

# ======================= MODELLER (HEPSİ ÜCRETSİZ) =======================
# Gemini ücretsiz katman. Sırayla denenir: ilki olmazsa (kota/hata) sonrakine geçer.
text_models: ["gemini-flash-latest", "gemini-flash-lite-latest"]   # fikir + senaryo (Flash: günde 20 → az kullanılır)
judge_models: ["gemini-flash-lite-latest", "gemini-flash-latest"]  # editör + thumbnail hakemi (Lite: günde 500)
factcheck_models: ["gemini-flash-lite-latest", "gemini-flash-latest"]  # Google aramalı doğrulama
# Görseller: Cloudflare Workers AI FLUX.1 schnell (günde ~170 görsel ücretsiz).
# Kota biterse otomatik olarak Pexels fotoğraflarına geçer.

# Seslendirme: Kokoro (açık kaynak, GitHub sunucusunda çalışır)
voice:
  name: "af_heart"             # en yüksek kaliteli ses. Erkek: "am_michael" / İngiliz: "bm_george" (lang "b")
  lang: "a"                    # a = Amerikan İngilizcesi, b = İngiliz İngilizcesi
  speed: 0.95                  # belgesel temposu

# ======================= KURGU / MARKA =======================
use_intro: true                # 1. sahneden (merak uyandıran açılış) sonra 2.6 sn logo animasyonu
outro_line: "And that's how it actually works. See you in the next Cutaway."
outro_hold_seconds: 8          # kapanış cümlesinden sonra kapanış kartı ekranda kalma süresi
shot_seconds: 4.5              # bir görüntünün ortalama ekranda kalma süresi (profesyonel tempo 3-6 sn)
burn_captions: true            # uzun videoda ekrana gömülü sade altyazı
music_db: -21                  # müzik seviyesi (anlatım varken ayrıca otomatik kısılır)

# ======================= KALİTE =======================
target_words: 1400             # ~9-10 dakika (8+ dk = ara reklam imkânı)
min_length_ratio: 0.85         # bunun altındaysa senaryo genişletilir
max_expand_rounds: 2
min_diagram_ratio: 0.4         # sahnelerin en az %40'ı AI diyagram olsun
min_quality_score: 7           # 5 editör kriterinin hepsi en az bu puan (hedef)
min_quality_floor: 0           # 0 = hedef tutmasa da en iyi senaryo HER ZAMAN yayınlanır (videosuz gün olmaz)
max_topic_attempts: 5          # baraj/bilgi kontrolü geçilemezse yeni konuyla tekrar dene
max_rewrites: 2
max_factcheck_rounds: 2
require_web_factcheck: true    # doğrulama çalışmazsa video ÜRETİLMEZ
fallback_broll: "industrial machinery close up"
explore_rate: 0.25             # %25 ihtimalle yeni konu türü dener (öğrenme için)

# ======================= YAYIN =======================
uploader: "youtube"            # youtube (ücretsiz) | ayrshare (ÜCRETLİ B planı, denetim reddedilirse)
category_id: "27"              # 27 = Education
publish_mode: "private"        # ÖNCE "private" ile test et → sonra "scheduled"
publish_delay_hours: 6         # ana video üretimden 6 saat sonra yayında (kontrol penceresi)
# Altyazı izleri: İngilizce (orijinal) + çeviri. Türk izleyici Türkçe altyazı ve Türkçe başlık görür.
subtitle_translation:
  code: "tr"
  name: "Turkish"
  label: "Türkçe"

make_shorts: true
shorts_per_video: 3            # her uzun videodan kaç farklı Short (YouTube günlük yükleme kotası: en fazla 4)
shorts_delay_hours: 20         # ilk Short, ana videodan 20 saat sonra
shorts_gap_hours: 16           # sonraki Shortlar 16'şar saat arayla → her gün yeni Short

# ======================= INSTAGRAM =======================
instagram_enabled: false       # IG anahtarları eklenince true yap
instagram_ai_label: true       # Reel'e "AI ile üretildi" etiketi
# Not: Instagram'da zamanlama yok; Reel üretim anında yayınlanır.
# publish_mode "private" iken Instagram'a HİÇ gönderilmez (test güvenliği).

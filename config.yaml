# ======================= KANAL KİMLİĞİ =======================
# Niş: Education & Science (2026 verisinde en yüksek medyan RPM'li kategori)
channel_name: "Cutaway"        # kanal adını değiştirirsen burayı da değiştir
notify_prefix: "🔧 Cutaway |"   # Telegram mesajlarında hangi kanal olduğu
channel_brief: >
  Science and engineering behind everyday things and
  giant systems. Each video takes ONE thing (a jet engine, a dam, GPS, a
  refrigerator, a container port, a nuclear reactor, why glass is transparent)
  and explains how it works, step by step, with a surprising "aha" moment.
  Also covers the cost/economics side when it helps understanding. No real
  people as main subjects, no investment/medical/legal advice, no politics,
  no current news (content must stay true for years).
audience: "curious adults 18-55 in the US, UK, Canada, Australia"
tone: "a friendly, calm storyteller explaining to a smart friend who knows nothing about the topic; simple everyday words, clear, curious, occasional dry humor"
language: "English"
language_code: "en"

script_rules: >
  HOOK (first 2-3 sentences): show the subject and state the surprising outcome or
  question right away so the viewer knows they clicked the right video; no
  greetings, no "in today's video", no clichés ("did you know", "imagine",
  "from sand to smartphone"), no fake suspense that withholds basic info.
  Preview the payoff early, then deliver it. Proven arc: open on the strange observation or
  failure → rule out the obvious explanation → show the physics step by step → reveal the
  engineering trade-off (why it is built this way and what it costs). Make invisible forces
  tangible with scale comparisons. Structure the video in clear
  chapters; each chapter answers one question. Explain like a great teacher:
  one idea per scene, define a term right before using it, everyday analogies,
  concrete examples, scale comparisons; every claim gets a visual proof (a
  diagram or footage that shows it). Change the angle when the information
  changes (claim → evidence → consequence). Only well-established science and
  engineering facts; if a number is uncertain give a range or say "roughly".
  The opening line must deliver exactly what the title and thumbnail promise (no bait-and-switch).
  Every 30-40 seconds add a small turn that renews curiosity (a question, a surprising number, a
  "but here's the catch"). Use signposts sparingly. No filler, no "smash the like button", no clickbait
  the video doesn't deliver. End with a one-line takeaway. Do NOT add a
  sign-off, greeting or "subscribe" line — the channel's fixed closing line is
  added automatically.

# Arama ve paketleme (2026 araştırması): anahtar kelime üçlemesi, aranabilir bölümler, yazım hatası etiketleri
title_examples: >   # same pattern in English: concrete people/number + what happened + the open question
  "Blast Furnace: Why Shutting It Down for 1 Day Costs $10 Million" ·
  "Jet Engines: How a 2-Pound Bird Can Destroy a $30 Million Engine" ·
  "Hoover Dam: Why Its Concrete Needed 582 Miles of Cooling Pipes"
saturation_views: 500000   # rakip analizi: bu izlenmenin üstündeki videolar 'büyük rakip' sayılır
seo_rules: >
  Pick core_keyword as the phrase a US viewer actually types (e.g. "how a jet engine works",
  "why glass is transparent"). Put it at the start of the title, in the first sentence of the
  description, and say it naturally in the first 20 seconds of narration. Chapter titles are
  Google-style queries ("How the Compressor Works", "Why Turbines Don't Melt"). Tags: core
  keyword, variants, common misspellings of the technical terms and names, related entities.
  pinned_comment: a sharp but friendly A-or-B engineering debate tied to the video (e.g.
  "Nuclear or solar for a city of 1 million — which would you build?").

# Rakip analizi (Practical Engineering, Real Engineering, Branch Education, Jared Owen, The B1M):
# en çok izlenenler tek bir somut tuhaflık, felaket/arıza analizi ve görünmez altyapıyı somutlaştıran videolar.
content_pillars:
  - "How a machine or device works, from the inside (engines, fridges, batteries, phones)"
  - "Giant infrastructure explained (power grids, dams, ports, bridges, internet cables)"
  - "Everyday science mysteries (why ice floats, why the sky is blue, how soap works)"
  - "How it's made and what it really costs (steel, glass, chips, paper, concrete)"
  - "Engineering failures and disasters explained (what broke, why, and what engineers changed after)"
  - "Hidden engineering you see every day but never notice (road details, tower bases, manholes, rail joints)"
  - "Engineering mysteries and strange structures (sinking buildings, unexplained failures, abandoned megaprojects, structures that shouldn't still stand)"
# Ağırlık (veri gelene kadar): felaket ve gizem ağırlıklı (31.10 kararı: gizemin merak çekiciliği + mühendislik farkı)
pillar_weights: [1, 1, 0.7, 0.8, 2.5, 1, 2.5]

idea_rules: >
  Each idea centers on ONE concrete oddity, failure or seemingly impossible conflict,
  never a broad subject ("Why Roads Get Washboards", not "How Roads Work"). Proven title
  shapes: "Why [familiar thing] [does counterintuitive thing]", "The [Hidden/Bizarre/Wild]
  [part/story/flaw] of [specific thing]", "What Actually Happens When [X]", "How [X] Survives
  [extreme Y]". Keep the noun specific. Failures: evergreen post-mortems (decades old,
  well documented), respectful to victims, focus on the engineering lesson.
  Frame EVERY idea like a mystery to be solved (stakes + an open question + the moment it went wrong
  or the thing nobody can explain), then solve it with engineering: "Why Did This Bridge Collapse in
  4 Minutes?", "The Dam That Failed Overnight: What Engineers Missed", "Why This Skyscraper Is Still
  Sinking". The engineering explanation (diagrams, inside views) is our edge over mystery channels.

playlists:   # her konu sütunu bir oynatma listesi (izleyici videodan videoya akar)
  "How a machine or device works, from the inside (engines, fridges, batteries, phones)": "How Machines Work Inside"
  "Giant infrastructure explained (power grids, dams, ports, bridges, internet cables)": "Giant Infrastructure Explained"
  "Everyday science mysteries (why ice floats, why the sky is blue, how soap works)": "Everyday Science Mysteries"
  "How it's made and what it really costs (steel, glass, chips, paper, concrete)": "How It's Made & What It Costs"
  "Engineering failures and disasters explained (what broke, why, and what engineers changed after)": "Engineering Failures Explained"
  "Hidden engineering you see every day but never notice (road details, tower bases, manholes, rail joints)": "Hidden Engineering"
  "Engineering mysteries and strange structures (sinking buildings, unexplained failures, abandoned megaprojects, structures that shouldn't still stand)": "Engineering Mysteries"

# Kanalın görsel kimliği: her diyagram bu stilde üretilir → tutarlı marka görünümü
visual_style: >
  clean modern educational illustration, 3D cutaway / exploded view / cross-section where useful,
  flat vector look with soft gradients, dark navy background, glowing cyan and
  warm orange accents, clear arrows showing flow, no text or labels, 16:9
watch_next_text: "▶ Watch next:"
thumbnail_rules: >
  Cutaway look: the real object shown as a photoreal 3D cutaway or exploded view with glowing
  internals, or the object at an extreme moment (red-hot, cracked, giant next to a tiny human
  for scale). Orange-and-teal contrast, dark background. When it fits, add one small human figure
  with a clear reaction or for scale (an invented person, never a real one): emotion lifts clicks.
thumbnail_style: "bold, high contrast, dramatic lighting, one clear object, cinematic, vivid colors"

# Kanal sayfası (ilk gerçek çalışmada bir kez otomatik ayarlanır)
branding:
  version: 4                   # afiş/açıklama değişince artır → bir sonraki çalışmada kanala yeniden uygulanır
  banner: "assets/cutaway_banner.jpg"
  country: "TR"
  keywords: "how things work engineering explained science explained infrastructure machines engineering failures how it's made cutaway"
  description: |
    ⚙️ How things actually work. Cutaway takes ONE thing — a jet engine, a dam, a microchip, a fridge — and opens it up, step by step.
    🏗️ Giant infrastructure, hidden everyday engineering, famous engineering failures and how things are made (and what they really cost).
    🔬 Clear 3D-style diagrams, real footage and fact-checked scripts. No fluff, no clickbait the video doesn't deliver.

# ======================= KANAL KİMLİĞİ =======================
# Niş: Education & Science (2026 verisinde en yüksek medyan RPM'li kategori)
channel_name: "Cutaway"        # kanal adını değiştirirsen burayı da değiştir
notify_prefix: "🔧 Cutaway |"   # Telegram mesajlarında hangi kanal olduğu
channel_brief: >
  Strange true events, investigated (niche since 3 Nov 2026). Unexplained phenomena and
  "supernatural" cases, vanishings, places and objects that shouldn't exist, and disasters
  nobody saw coming. Each video takes ONE real, well documented case, opens it like a mystery,
  lays out the evidence first, then weighs every explanation fairly (including the paranormal
  ones, without mocking) and shows what science and engineering can and can't explain. Our
  signature: we "cut the mystery open" with clear diagrams and cutaway views of the evidence.
  Respectful to victims and believers, evergreen cases, no current news, no politics, no
  living private people as the subject, no investment/medical/legal advice.
audience: "curious adults 18-55 in the US, UK, Canada, Australia"
tone: "a calm, slightly dark documentary storyteller talking to a smart friend at night; simple everyday words, gripping, fair-minded, never sensational, rare dry humor"
language: "English"
language_code: "en"

script_rules: >
  HOOK (first 2-3 sentences): show the subject and state the surprising outcome or
  question right away so the viewer knows they clicked the right video; no
  greetings, no "in today's video", no clichés ("did you know", "imagine",
  "from sand to smartphone"), no fake suspense that withholds basic info.
  Preview the payoff early, then deliver it. Proven arc: open on the strange fact → what we know
  for sure → rule out the obvious explanation → test each theory against the evidence → the
  most likely answer and what is still unknown. Make distances, forces, cold and time tangible
  with scale comparisons. Structure the video in clear
  chapters; each chapter answers one question. Explain like a great teacher:
  one idea per scene, define a term right before using it, everyday analogies,
  concrete examples, scale comparisons; every claim gets a visual proof (a
  diagram or footage that shows it). Change the angle when the information
  changes (claim → evidence → consequence). Only well-established science and
  engineering facts; if a number is uncertain give a range or say "roughly".
  The opening line must deliver exactly what the title and thumbnail promise (no bait-and-switch).
  Every 30-40 seconds add a small turn that renews curiosity (a question, a surprising number, a
  "but here's the catch"). Use signposts sparingly. No filler, no "smash the like button", no clickbait
  the video doesn't deliver. End with a one-line takeaway. Do NOT add a
  sign-off, greeting or "subscribe" line — the channel's fixed closing line is
  added automatically.
  DOCUMENTARY METHOD (learned from the best mystery and investigation channels; method, never copying):
  1) Cold open on the strangest concrete detail with date and place ("February 1959, Ural Mountains.
  The rescuers found the tent cut open from the inside.").
  2) Timeline: tell it in order, hour by hour or day by day; say the date/time/place at each key
  moment and put it in that scene's callout ("Feb 2, 1959 · 9 PM").
  3) Evidence first, interpretation later: a "What we know for sure" chapter with only documented
  facts (official reports, witness statements, photos, measurements); rumors are labeled "reportedly".
  4) Correct ONE commonly repeated myth with its source ("Most retellings say X; the report says Y").
  This is our trust moment.
  5) Theories chapter: 3-4 explanations from WEAKEST to STRONGEST; for each, its best evidence and what
  weakens it. Paranormal theories are presented fairly, without mocking. Use a cutaway/diagram to
  test each explanation physically (forces, distances, temperatures, timings) in US units with
  everyday comparisons. For disasters, follow the investigation: warning signs → moment of failure →
  what the official report found (name the agency) → the root cause → what changed after.
  6) Verdict: "The evidence best supports…", clear but humble; say plainly what is still unknown.
  7) Close on what the case left behind, then the A-or-B question that matches the pinned comment.
  Chapter titles follow this arc ("The Night It Happened", "What We Know for Sure", "What Everyone
  Gets Wrong", "The Theories", "What the Evidence Says").

# Arama ve paketleme (2026 araştırması): anahtar kelime üçlemesi, aranabilir bölümler, yazım hatası etiketleri
title_examples: >   # concrete place/number + the strange fact + the open question
  "Dyatlov Pass: Why 9 Hikers Cut Their Tent Open and Ran Into the Snow" ·
  "The Mary Celeste: A Ship Found Sailing With No One Aboard" ·
  "Hyatt Regency: How One Changed Bolt Killed 114 People" ·
  "The Wow! Signal: 72 Seconds From Space Nobody Can Explain"
saturation_views: 500000   # rakip analizi: bu izlenmenin üstündeki videolar 'büyük rakip' sayılır
seo_rules: >
  Pick core_keyword as the phrase a US viewer actually types (e.g. "dyatlov pass incident",
  "mary celeste mystery"). Put it at the start of the title, in the first sentence of the
  description, and say it naturally in the first 20 seconds of narration. Chapter titles are
  Google-style queries ("What Happened at Dyatlov Pass", "Dyatlov Pass Theories"). Tags: core
  keyword, variants, common misspellings of the names and places, related entities.
  pinned_comment: a sharp but friendly A-or-B vote on the case (e.g. "What really happened that
  night? 1) avalanche 2) something we still can't explain").

# Rakip analizi (LEMMiNO, Fascinating Horror, Plainly Difficult, Wendigoon tarzı vaka anlatıcıları):
# en çok izlenenler tek bir somut, belgeli ve hâlâ tartışılan vaka; fark: kanıtı kesitle göstermek.
content_pillars:
  - "Unexplained events and 'supernatural' cases investigated (strange deaths, sightings, sounds, lights)"
  - "Vanishings: ships, planes, expeditions and people that disappeared without a trace"
  - "Disasters nobody saw coming: what really broke inside (collapses, explosions, dam and bridge failures)"
  - "Places and objects that shouldn't exist (impossible structures, strange signals, out-of-place finds)"
# 03.11 kararı (Furkan): yalnız mühendislik değil, sıra dışı/doğaüstü olaylar da; kimlik = "gerçek tuhaf olaylar, kanıtla incelenir"
pillar_weights: [3, 2.5, 2, 1.5]

idea_rules: >
  Each idea centers on ONE real, well documented case with a concrete strange fact, never a broad
  subject ("Why 9 Hikers Cut Their Tent Open", not "Mysteries of Russia"). Frame every idea as a
  question the viewer can't stop thinking about (stakes + the moment + the thing nobody can explain).
  Prefer cases with documents, photos, official reports or measurements we can show; skip cases that
  are pure internet rumor. Evergreen (at least ~10 years old), respectful to victims.

playlists:   # her konu sütunu bir oynatma listesi (izleyici videodan videoya akar)
  "Unexplained events and 'supernatural' cases investigated (strange deaths, sightings, sounds, lights)": "Unexplained Cases, Investigated"
  "Vanishings: ships, planes, expeditions and people that disappeared without a trace": "Vanished Without a Trace"
  "Disasters nobody saw coming: what really broke inside (collapses, explosions, dam and bridge failures)": "Disasters: What Really Broke"
  "Places and objects that shouldn't exist (impossible structures, strange signals, out-of-place finds)": "Things That Shouldn't Exist"

# Kanalın görsel kimliği: her diyagram bu stilde üretilir → tutarlı marka görünümü
visual_style: >
  clean modern documentary illustration, 3D cutaway / cross-section / evidence map where useful,
  moody night palette, dark navy background, glowing cyan and
  warm orange accents, clear arrows showing flow, no text or labels, 16:9
watch_next_text: "▶ Watch next:"
thumbnail_rules: >
  Cutaway signature (same on every video so viewers recognize us): ONE eerie, real-looking scene of
  the case at night or in cold light (the cut tent in the snow, the empty ship, the cracked dam),
  with ONE key piece of evidence highlighted as a glowing orange cutaway or outline, the brightest
  thing in the frame. Dark cold-teal surroundings, lots of empty dark space. Optionally a tiny
  invented human silhouette for scale. Never gore, never real victims' faces, never a real person.
thumbnail_style: "bold, high contrast, dramatic lighting, one clear object, cinematic, vivid colors"

# Kanal sayfası (ilk gerçek çalışmada bir kez otomatik ayarlanır)
branding:
  version: 5                   # afiş/açıklama değişince artır → bir sonraki çalışmada kanala yeniden uygulanır
  banner: "assets/cutaway_banner.jpg"
  country: "TR"
  keywords: "unexplained mysteries unsolved mysteries strange true stories disappearances disasters explained paranormal investigated documentary cutaway"
  description: |
    🕯️ Strange true events, investigated. Cutaway takes ONE real case — a vanishing, an unexplained death, a disaster nobody saw coming — and cuts it open.
    🔎 Evidence first, then every theory weighed fairly (yes, the paranormal ones too), and what science can and can't explain.
    🧩 Clear cutaway diagrams, real photos and fact-checked scripts. No fluff, no clickbait the video doesn't deliver.
    💬 Vote on every case in the comments and tell us which mystery we should open next.

subscribe_text: "🔔 Subscribe for a new case every week:"
made_for_kids: false
declare_synthetic: true        # AI içerik beyanı (YouTube politikası)
yt_brand_tag: "#cutaway"        # her uzun videonun ve Short'un hashtag satırında olur

# ======================= MODELLER =======================
# Cutaway kendi ücretsiz anahtarını (GEMINI_API_KEY) kullanır. GEMINI_PAID_API_KEY Gölgedefter'e aittir.
# Ücretli katmana geçilirse: env_map ile GEMINI_API_KEY ← GEMINI_PAID_API_KEY ve paid_tier: true
paid_tier: false
paid_text_models: ["gemini-pro-latest", "gemini-flash-latest"]
paid_judge_models: ["gemini-flash-latest", "gemini-flash-lite-latest"]
# Gemini ücretsiz katman. Sırayla denenir: ilki olmazsa (kota/hata) sonrakine geçer.
text_models: ["gemini-flash-latest", "gemini-flash-lite-latest"]   # fikir + senaryo (Flash: günde 20 → az kullanılır)
judge_models: ["gemini-flash-lite-latest", "gemini-flash-latest"]  # editör + thumbnail hakemi (Lite: günde 500)
factcheck_models: ["gemini-flash-lite-latest", "gemini-flash-latest"]  # Google aramalı doğrulama
# Görseller: Cloudflare Workers AI FLUX.1 schnell (günde ~170 görsel ücretsiz).
# Kota biterse otomatik olarak Pexels fotoğraflarına geçer.

# Seslendirme: Kokoro (açık kaynak, GitHub sunucusunda çalışır)
# Ses: Gemini (doğal, vurgulu; robotik ses ilk 45 sn'de izleyici kaybettiriyor). Ücretsiz katman, Cutaway'in
# kendi Google projesinin kotası. Alınamazsa video yine çıksın diye yedek: Kokoro (ücretsiz, yerel).
voice:
  provider: "gemini"
  name: "Sadaltager"           # "bilgili" tonlu erkek ses. Alternatif: "Charon" (bilgilendirici), "Iapetus" (net)
  style: "Read in clear American English like a calm, curious science documentary narrator, with natural emphasis on key numbers and short pauses between sentences"
  models: ["gemini-3.1-flash-tts-preview", "gemini-2.5-flash-preview-tts"]
  sentence_gap: 0.3
  scene_gap: 0.6
  scenes_per_request: 6
  fallback:
    name: "af_heart"
    lang: "a"
    speed: 0.88
    sentence_gap: 0.35
    scene_gap: 0.6

# ======================= KURGU / MARKA =======================
use_intro: true                # 1. sahneden (merak uyandıran açılış) sonra 2.6 sn logo animasyonu
outro_line: "And that's how it actually works. If you're not subscribed yet, subscribing really helps the channel grow. And if you made it this far, a like goes a long way. See you in the next Cutaway."
outro_hold_seconds: 8          # kapanış cümlesinden sonra kapanış kartı ekranda kalma süresi
shot_seconds: 4.5              # bir görüntünün ortalama ekranda kalma süresi (profesyonel tempo 3-6 sn)
hook_scenes: 2                 # ilk 2 sahnede görsel, anlatılanın birebir karşılığı (stok görüntü yok)
j_cut_seconds: 0.3             # yeni sahnenin sesi görüntüden 0.3 sn önce başlar (kurgucu geçişi)
burn_captions: true            # uzun videoda ekrana gömülü sade altyazı
# --- iki kanalda ortak kurallar (Gölgedefter de bunları varsayılan olarak kullanır) ---
caption_word_highlight: true    # altyazı kelime kelime ilerler: söylenen kelime kanalın vurgu renginde
caption_words_per_line: 5       # kısa satırlar; iki satır asla aynı anda görünmez
visual_per_sentence: true       # her cümleye kendi görseli: görüntü, o cümle söylenirken değişir
max_sentence_images: 60         # video başına cümle görseli (AI) üst sınırı; aşılırsa stok fotoğraf
max_footage_checks: 160         # stok videonun cümleyle uyumunu kontrol (ucuz Gemini modeli)
music_db: -21                  # müzik seviyesi (anlatım varken ayrıca otomatik kısılır)

# ======================= KALİTE =======================
target_words: 1650             # ~12-13 dakika (bu nişte izleyici 12-20 dk seviyor; 8+ dk = ara reklam)
min_length_ratio: 0.85         # bunun altındaysa senaryo genişletilir
max_expand_rounds: 2
min_diagram_ratio: 0.4         # sahnelerin en az %40'ı AI diyagram olsun
min_quality_score: 7           # 5 editör kriterinin hepsi en az bu puan (hedef)
min_quality_floor: 0           # 0 = hedef tutmasa da en iyi senaryo HER ZAMAN yayınlanır (videosuz gün olmaz)
max_topic_attempts: 5          # baraj/bilgi kontrolü geçilemezse yeni konuyla tekrar dene
max_rewrites: 2
# ABD izleyicisi: önce ABD birimleri + herkesin gözünde canlanan karşılaştırma
units_rule: >
  The audience is American: use Fahrenheit, feet, miles, pounds and gallons first (you may add the metric
  value once after it). Never use Celsius or metric alone. Always pair a number with a picture
  ("two thousand seven hundred degrees Fahrenheit, about three times hotter than a pizza oven").
plain_rules: >
  Explain technical words as if to a friend over coffee: "slag, the stony waste that floats on top
  of the melted iron like foam on soup". Prefer "melted" over "molten", "heat-proof bricks" over
  "refractory" (or explain it), "mix" over "mixture" when the meaning is the same.
max_factcheck_rounds: 2
require_web_factcheck: true    # doğrulama çalışmazsa video ÜRETİLMEZ
fallback_broll: "dark foggy forest at night"
explore_rate: 0.25             # %25 ihtimalle yeni konu türü dener (öğrenme için)

# ======================= YAYIN =======================
uploader: "youtube"            # youtube (ücretsiz) | ayrshare (ÜCRETLİ B planı, denetim reddedilirse)
category_id: "27"              # 27 = Education
publish_mode: "scheduled"     # 2.11.2026: YouTube API denetimi onaylandı → sistem kendisi yükler ve planlar
publish_delay_hours: 6         # (yayın saatleri tanımlı değilse kullanılır)
# ABD izleyicisi: uzun video 14:00 ET, Shorts akşam 18:00 ET (vidIQ 40 milyon video verisi)
publish_slots: {tz: "America/New_York", times: {default: "14:00"}}
shorts_slots: {tz: "America/New_York", times: {default: "18:00"}}
min_lead_hours: 1.5            # yükleme ile yayın arasında en az bu kadar (HD işleme tamamlansın)
post_comment: true             # video yayına girince tartışma sorusu kanal adına yorum olarak yazılır
ascii_tag_variants: false
# Altyazı izleri: İngilizce (orijinal) + Türkçe çeviri izi (izleyici CC'den açar).
# Başlık, açıklama ve Shorts açıklamaları HER ZAMAN İngilizce (Türkçe çeviri başlık eklenmez).
localize_metadata: false
subtitle_translation:
  code: "tr"
  name: "Turkish"
  label: "Türkçe"

make_shorts: true
shorts_per_video: 3            # her uzun videodan kaç farklı Short (YouTube günlük yükleme kotası: en fazla 4)
shorts_delay_hours: 20         # ilk Short ana videodan sonraki günün Shorts saatinde
shorts_gap_hours: 20           # sonraki Shortlar birer gün arayla

# ======================= INSTAGRAM =======================
instagram_enabled: false       # IG anahtarları eklenince true yap
instagram_ai_label: true       # Reel'e "AI ile üretildi" etiketi
# Not: Instagram'da zamanlama yok; Reel üretim anında yayınlanır.
# publish_mode "private" iken Instagram'a HİÇ gönderilmez (test güvenliği).

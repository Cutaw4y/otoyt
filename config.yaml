# Planlı seri (Furkan, 03.11): sırayla, her 2 videodan biri. id değişmesin (yayınlananlar id ile izlenir).
series_every: 1   # kanal artık tamamen bu konuda: seri bölümleri art arda
series:
  - id: jinn-1
    pillar: "Jinn: what the Quran, authentic hadith and classical scholars actually say"
    title: "Jinn: What the Quran Actually Says About the Hidden Beings"
    search_query: "what are jinn in islam"
    angle: >
      Part 1 of our Jinn series. Explain what jinn are ONLY from the primary sources, each with its
      reference shown on screen: created from smokeless fire (Ar-Rahman 55:15, Al-Hijr 15:27), created
      to worship like humans (Adh-Dhariyat 51:56), have free will and believers among them (Surah Al-Jinn
      72:1-15; Al-Ahqaf 46:29-32), Iblis was one of them (Al-Kahf 18:50), they worked for Prophet
      Sulayman (Saba 34:12-14), and what authentic hadith (Bukhari/Muslim, cite the book) add. Correct the
      big Western myth: jinn are not wish-granting genies; the "genie" comes from European translations
      of One Thousand and One Nights. End by promising part 2 (real reported cases from Turkey).
  - id: qaf-1
    pillar: "Lost cities and legends of the ancient Middle East (Iram of the Pillars, Solomon's jinn, Dhul-Qarnayn's wall, the People of the Cave)"
    title: "Mount Qaf: The Mountain at the Edge of the World Where the Jinn Live"
    search_query: "mount qaf jinn legend"
    angle: >
      The legend our channel is named after. What classical Islamic and Persian sources say about Mount
      Qaf (the mountain of emerald encircling the world, home of jinn and the Simurgh), naming the
      authors and works (e.g. tafsir traditions on Surah Qaf, al-Qazwini's Aja'ib al-Makhluqat, Attar's
      Conference of the Birds), clearly separating folklore and later tradition from what the Quran
      itself says (Surah Qaf begins with the letter Qaf; the mountain is NOT stated in the Quran).
      Why "beyond Mount Qaf" became a saying for "impossibly far away" in Turkish and Persian. Respectful;
      say plainly which parts are legend.
  - id: jinn-2
    pillar: "Reported jinn encounters and places people avoid, from documented accounts"
    title: "Karabasan: The Jinn Encounters Millions of Turks Report"
    search_query: "jinn encounters turkey karabasan"
    angle: >
      Part 2 of our Jinn series (remind viewers of part 1 in one sentence). The most commonly reported
      jinn experiences in Turkey, centered on "karabasan" (the night-time pressing presence) and other
      widely reported patterns; use only documented, publicly reported accounts (news reports, published
      research, folklore archives), never invent names or cases. What witnesses describe, what the
      tradition says, and what sleep researchers say about sleep paralysis, without ruling on the faith.
      End by promising part 3 (similar encounters around the world).
  - id: jinn-3
    pillar: "The same beings across cultures: jinn compared with demons, fairies, shadow people and sleep paralysis visitors"
    title: "The Same Night Visitor, Seen in Every Culture"
    search_query: "jinn encounters around the world sleep paralysis demon"
    angle: >
      Part 3 of our Jinn series (one sentence recap). Documented reports from around the world that
      match the jinn experience: the Old Hag of Newfoundland, kanashibari in Japan, pisadeira in Brazil,
      the djinn reports of the Middle East and South Asia. Why so many cultures describe the same visitor,
      what science explains and what it still can't. Respectful to every belief. Close the series.


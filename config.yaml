ascii_tag_variants: false
# Altyazı izleri: İngilizce (orijinal) + Türkçe çeviri izi (izleyici CC'den açar).
# Başlık, açıklama ve Shorts açıklamaları HER ZAMAN İngilizce (Türkçe çeviri başlık eklenmez).
localize_metadata: false
subtitle_translation:
  code: "tr"
  name: "Turkish"
  label: "Türkçe"
  notes: >
    Turkish viewers are mostly Muslims who know these terms: use the established Turkish Islamic
    terms (cin, şeytan, İblis, karîn, nazar, sihir/büyü, rukye, gayb, melek, Kur'an-ı Kerim, sure,
    ayet, hadis, Hz. Süleyman, Hz. Muhammed (s.a.v.)), and write sura names the Turkish way
    (Rahman Suresi 15. ayet, Cin Suresi, Hicr Suresi). Never translate "jinn" as "peri" or "ruh",
    never "genie" as anything but "lamba cini" when it means the Western genie. Respectful tone.

make_shorts: true
shorts_per_video: 3            # her uzun videodan kaç farklı Short (YouTube günlük yükleme kotası: en fazla 4)
shorts_delay_hours: 20         # ilk Short ana videodan sonraki günün Shorts saatinde
shorts_gap_hours: 20           # sonraki Shortlar birer gün arayla


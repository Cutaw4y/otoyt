  - "Jinn: what the Quran, authentic hadith and classical scholars actually say"
  - "Reported jinn encounters and places people avoid, from documented accounts"
  - "The unseen in Islamic tradition explained from sources (the qareen, the evil eye, Iblis, Harut and Marut, the ghayb)"
  - "Lost cities and legends of the ancient Middle East (Iram of the Pillars, Solomon's jinn, Dhul-Qarnayn's wall, the People of the Cave)"
  - "The same beings across cultures: jinn compared with demons, fairies, shadow people and sleep paralysis visitors"
# 03.11 kararı (Furkan): kanal tamamen cinler ve görünmeyen âleme odaklandı.
pillar_weights: [3, 2.5, 2, 2, 1.5]

idea_rules: >
  Each idea centers on ONE specific record: one verse/story, one named being, one documented
  account, one place or one legend, never a broad subject ("Why Jinn Fear Iron in Folklore", not
  "All About Jinn"). Frame it as a question the viewer can't stop thinking about. Prefer topics with
  clear primary sources we can cite. Never depict prophets; never give or describe how to perform
  magic, summoning or exorcism rituals (we may say such practices exist and what scholars say about
  them). Respect Islam and every faith; no mocking, no fear-mongering, no rulings on belief.


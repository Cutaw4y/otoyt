subscribe_text: "🔔 Subscribe for a new cutaway every week:"
made_for_kids: false
declare_synthetic: true        # AI içerik beyanı (YouTube politikası)
yt_brand_tag: "#cutaway"        # her uzun videonun ve Short'un hashtag satırında olur

# ======================= MODELLER =======================
# Cutaway kendi ücretsiz anahtarını (GEMINI_API_KEY) kullanır. GEMINI_PAID_API_KEY Gölgedefter'e aittir.
# Ücretli katmana geçilirse: env_map ile GEMINI_API_KEY ← GEMINI_PAID_API_KEY ve paid_tier: true
paid_tier: false
paid_text_models: ["gemini-pro-latest", "gemini-flash-latest"]
paid_judge_models: ["gemini-flash-latest", "gemini-flash-lite-latest"]
# Gemini ücretsiz katman. Sırayla denenir: ilki olmazsa (kota/hata) sonrakine geçer.
text_models: ["gemini-flash-latest", "gemini-flash-lite-latest"]   # fikir + senaryo (Flash: günde 20 → az kullanılır)
judge_models: ["gemini-flash-lite-latest", "gemini-flash-latest"]  # editör + thumbnail hakemi (Lite: günde 500)
factcheck_models: ["gemini-flash-lite-latest", "gemini-flash-latest"]  # Google aramalı doğrulama
# Görseller: Cloudflare Workers AI FLUX.1 schnell (günde ~170 görsel ücretsiz).
# Kota biterse otomatik olarak Pexels fotoğraflarına geçer.

# Seslendirme: Kokoro (açık kaynak, GitHub sunucusunda çalışır)
# Ses: Gemini (doğal, vurgulu; robotik ses ilk 45 sn'de izleyici kaybettiriyor). Ücretsiz katman, Cutaway'in
# kendi Google projesinin kotası. Alınamazsa video yine çıksın diye yedek: Kokoro (ücretsiz, yerel).
voice:
  provider: "gemini"
  name: "Sadaltager"           # "bilgili" tonlu erkek ses. Alternatif: "Charon" (bilgilendirici), "Iapetus" (net)
  style: "Read in clear American English like a calm, curious science documentary narrator, with natural emphasis on key numbers and short pauses between sentences"
  models: ["gemini-3.1-flash-tts-preview", "gemini-2.5-flash-preview-tts"]
  sentence_gap: 0.3
  scene_gap: 0.6
  scenes_per_request: 6
  fallback:
    name: "af_heart"
    lang: "a"
    speed: 0.88
    sentence_gap: 0.35
    scene_gap: 0.6

# ======================= KURGU / MARKA =======================
use_intro: true                # 1. sahneden (merak uyandıran açılış) sonra 2.6 sn logo animasyonu
outro_line: "And that's how it actually works. If you're not subscribed yet, subscribing really helps the channel grow. And if you made it this far, a like goes a long way. See you in the next Cutaway."
outro_hold_seconds: 8          # kapanış cümlesinden sonra kapanış kartı ekranda kalma süresi
shot_seconds: 4.5              # bir görüntünün ortalama ekranda kalma süresi (profesyonel tempo 3-6 sn)
hook_scenes: 2                 # ilk 2 sahnede görsel, anlatılanın birebir karşılığı (stok görüntü yok)
j_cut_seconds: 0.3             # yeni sahnenin sesi görüntüden 0.3 sn önce başlar (kurgucu geçişi)
burn_captions: true            # uzun videoda ekrana gömülü sade altyazı
# --- iki kanalda ortak kurallar (Gölgedefter de bunları varsayılan olarak kullanır) ---
caption_word_highlight: true    # altyazı kelime kelime ilerler: söylenen kelime kanalın vurgu renginde
caption_words_per_line: 5       # kısa satırlar; iki satır asla aynı anda görünmez
visual_per_sentence: true       # her cümleye kendi görseli: görüntü, o cümle söylenirken değişir
max_sentence_images: 60         # video başına cümle görseli (AI) üst sınırı; aşılırsa stok fotoğraf
max_footage_checks: 160         # stok videonun cümleyle uyumunu kontrol (ucuz Gemini modeli)
music_db: -21                  # müzik seviyesi (anlatım varken ayrıca otomatik kısılır)

# ======================= KALİTE =======================
target_words: 1650             # ~12-13 dakika (bu nişte izleyici 12-20 dk seviyor; 8+ dk = ara reklam)
min_length_ratio: 0.85         # bunun altındaysa senaryo genişletilir
max_expand_rounds: 2
min_diagram_ratio: 0.4         # sahnelerin en az %40'ı AI diyagram olsun
min_quality_score: 7           # 5 editör kriterinin hepsi en az bu puan (hedef)
min_quality_floor: 0           # 0 = hedef tutmasa da en iyi senaryo HER ZAMAN yayınlanır (videosuz gün olmaz)
max_topic_attempts: 5          # baraj/bilgi kontrolü geçilemezse yeni konuyla tekrar dene
max_rewrites: 2
# ABD izleyicisi: önce ABD birimleri + herkesin gözünde canlanan karşılaştırma
units_rule: >
  The audience is American: use Fahrenheit, feet, miles, pounds and gallons first (you may add the metric
  value once after it). Never use Celsius or metric alone. Always pair a number with a picture
  ("two thousand seven hundred degrees Fahrenheit, about three times hotter than a pizza oven").
plain_rules: >
  Explain technical words as if to a friend over coffee: "slag, the stony waste that floats on top
  of the melted iron like foam on soup". Prefer "melted" over "molten", "heat-proof bricks" over
  "refractory" (or explain it), "mix" over "mixture" when the meaning is the same.
max_factcheck_rounds: 2
require_web_factcheck: true    # doğrulama çalışmazsa video ÜRETİLMEZ
fallback_broll: "industrial machinery close up"
explore_rate: 0.25             # %25 ihtimalle yeni konu türü dener (öğrenme için)

# ======================= YAYIN =======================
uploader: "youtube"            # youtube (ücretsiz) | ayrshare (ÜCRETLİ B planı, denetim reddedilirse)
category_id: "27"              # 27 = Education
publish_mode: "manual"         # API onayı gelene kadar: sistem üretir, sahibi Studio’dan elle yükler. Onaydan sonra "scheduled"
publish_delay_hours: 6         # (yayın saatleri tanımlı değilse kullanılır)
# ABD izleyicisi: uzun video 14:00 ET, Shorts akşam 18:00 ET (vidIQ 40 milyon video verisi)
publish_slots: {tz: "America/New_York", times: {default: "14:00"}}
shorts_slots: {tz: "America/New_York", times: {default: "18:00"}}
min_lead_hours: 1.5            # yükleme ile yayın arasında en az bu kadar (HD işleme tamamlansın)
post_comment: true             # video yayına girince tartışma sorusu kanal adına yorum olarak yazılır
ascii_tag_variants: false
# Altyazı izleri: İngilizce (orijinal) + Türkçe çeviri izi (izleyici CC'den açar).
# Başlık, açıklama ve Shorts açıklamaları HER ZAMAN İngilizce (Türkçe çeviri başlık eklenmez).
localize_metadata: false
subtitle_translation:
  code: "tr"
  name: "Turkish"
  label: "Türkçe"

make_shorts: true
shorts_per_video: 3            # her uzun videodan kaç farklı Short (YouTube günlük yükleme kotası: en fazla 4)
shorts_delay_hours: 20         # ilk Short ana videodan sonraki günün Shorts saatinde
shorts_gap_hours: 20           # sonraki Shortlar birer gün arayla

# ======================= INSTAGRAM =======================
instagram_enabled: false       # IG anahtarları eklenince true yap
instagram_ai_label: true       # Reel'e "AI ile üretildi" etiketi
# Not: Instagram'da zamanlama yok; Reel üretim anında yayınlanır.
# publish_mode "private" iken Instagram'a HİÇ gönderilmez (test güvenliği).

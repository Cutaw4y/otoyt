# Niş (03.11.2026, Furkan): cinler ve görünmeyen âlem; İngilizce, ABD/İngiltere/Kanada izleyicisi
channel_name: "Beyond Qaf"   # 03.11.2026: eski adı Cutaway (YouTube Studio'dan ad değişikliği elle)
notify_prefix: "🕯️ Beyond Qaf |"
channel_id: "UCH4bEob06jM9poDzHWAlWqQ"   # kanal adı değişse de doğrulama bu kimlikle
channel_aliases: ["Cutaway", "Smokeless Archive"]   # Telegram mesajlarında hangi kanal olduğu
channel_brief: >
  Beyond Qaf: where the unseen lives (Mount Qaf: the legendary mountain at the edge of the world where
  the jinn live in Islamic and Eastern folklore). The world of the jinn and the unseen in Islamic and
  Middle Eastern tradition, told in English for people who have never heard it properly. What the
  Quran and authentic hadith actually say (always with the exact reference), what classical
  scholars wrote, documented encounters and places people report, the ancient legends of the
  region, and how the same beings appear in other cultures. A hooded narrator keeps the records.
  Respectful to Islam and to every faith: we never mock and never rule on the faith itself; we
  report what the sources say, what witnesses report and what researchers say. Never depict any
  prophet. No instructions for magic or rituals of any kind. No current news, no politics.
audience: "curious adults 18-55 in the US, UK, Canada, Australia: paranormal and folklore fans who have never heard the jinn tradition properly, plus English-speaking Muslims who want it told accurately and respectfully"
tone: "a calm, low, slightly dark storyteller, an archivist reading old records at night to a curious friend; simple everyday words, gripping, fair-minded and reverent, never sensational, never mocking"
language: "English"
language_code: "en"

script_rules: >
  HOOK (first 2-3 sentences): show the subject and state the surprising outcome or
  question right away so the viewer knows they clicked the right video; no
  greetings, no "in today's video", no clichés ("did you know", "imagine",
  "from sand to smartphone"), no fake suspense that withholds basic info.
  Preview the payoff early, then deliver it. Proven arc: open on the strange fact → what we know
  for sure → rule out the obvious explanation → test each theory against the evidence → the
  most likely answer and what is still unknown. Make distances, forces, cold and time tangible
  with scale comparisons. Structure the video in clear
  chapters; each chapter answers one question. Explain like a great teacher:
  one idea per scene, define a term right before using it, everyday analogies,
  concrete examples, scale comparisons; every claim gets a visual proof (a
  diagram or footage that shows it). Change the angle when the information
  changes (claim → evidence → consequence). Only well-established science and
  engineering facts; if a number is uncertain give a range or say "roughly".
  The opening line must deliver exactly what the title and thumbnail promise (no bait-and-switch).
  Every 30-40 seconds add a small turn that renews curiosity (a question, a surprising number, a
  "but here's the catch"). Use signposts sparingly. No filler, no "smash the like button", no clickbait
  the video doesn't deliver. End with a one-line takeaway. Do NOT add a
  sign-off, greeting or "subscribe" line — the channel's fixed closing line is
  added automatically.
  ARCHIVE METHOD (learned from the best folklore and mystery documentaries; method, never copying):
  1) Cold open on the strangest concrete detail of THIS record (a verse, a reported night, a place),
  with time and place when known.
  2) Sources first: what the Quran says (sura name + number:verse), what authentic hadith say (name
  the collection, e.g. Sahih al-Bukhari), what classical scholars wrote (name and century). Quote
  meaning carefully; never invent a verse, hadith, scholar, witness or case. Say "according to
  tradition" or "reportedly" for anything not in the primary sources.
  3) Explain every Arabic term the first time in plain English (jinn, ghayb, qareen, sihr, ruqyah).
  4) Correct ONE common Western myth with its source (e.g. genies granting wishes come from European
  translations of One Thousand and One Nights). This is our trust moment.
  5) Reported cases: only publicly documented accounts (books, news reports, published research,
  folklore archives); what witnesses described, in order.
  6) What researchers say (e.g. sleep paralysis, cultural psychology) presented fairly next to the
  believers' view; NEVER declare the faith true or false.
  7) Close on what the record leaves us with, then the A-or-B question that matches the pinned comment.
  Chapter titles follow this arc ("The Record", "What the Quran Says", "What People Get Wrong",
  "The Reported Nights", "What Researchers Say").

# Arama ve paketleme (2026 araştırması): anahtar kelime üçlemesi, aranabilir bölümler, yazım hatası etiketleri
title_examples: >   # concrete source/place/number + the strange fact + the open question
  "Mount Qaf: The Mountain at the Edge of the World Where the Jinn Live" ·
  "Jinn: What the Quran Actually Says About the Hidden Beings" ·
  "Iram of the Pillars: The City God Erased From the Map" ·
  "The Qareen: The Companion Islam Says Every Human Has" ·
  "Solomon's Jinn: Why They Kept Working After He Died"
saturation_views: 500000   # rakip analizi: bu izlenmenin üstündeki videolar 'büyük rakip' sayılır
seo_rules: >
  Pick core_keyword as the phrase a US viewer actually types (e.g. "what are jinn",
  "jinn in islam", "qareen meaning"). Put it at the start of the title, in the first sentence of the
  description, and say it naturally in the first 20 seconds of narration. Chapter titles are
  Google-style queries ("What Are Jinn Made Of", "Jinn in the Quran"). Tags: core
  keyword, variants, common misspellings of the names and places, related entities.
  pinned_comment: a respectful A-or-B vote on the record (e.g. "Had you heard of jinn before this
  video? 1) yes, I grew up with these stories 2) no, this is new to me"), never a vote on the faith.


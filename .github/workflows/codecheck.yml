name: Kod kontrolü (her değişiklikte)
on:
  push:
    paths: ["*.py", "config.yaml", "channels/*.yaml", "tests/**/*.py", ".github/workflows/codecheck.yml", "history.json", "ig_queue.json", "data/golgedefter/history.json", "data/golgedefter/ig_queue.json"]
concurrency:
  group: audit-codecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      # Sadece import/ünite testleri: Kokoro ve Whisper gibi GB'lık modelleri kurma.
      # Gerçek üretim işlerindeki requirements.txt aynen korunur.
      - run: pip install -q requests pyyaml pillow numpy
      - name: Derleme, ayar ve içe aktarma testi (iki kanal)
        run: |
          python -m py_compile *.py
          for c in config.yaml channels/golgedefter.yaml; do
            OTOYT_CONFIG=$c DRY_RUN=1 python -c "import pipeline, media, ai, voice, publish; p=pipeline; assert p.CFG['content_pillars']; print('OK', p.CFG['channel_name'])"
          done
      - name: Güvenlik ve kurtarma senaryoları (ağ/yayın yapılmaz)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Kayıt ve Git çakışması kontrolü (salt okunur)
        run: python3 json_guard.py
      - name: Canlı kayıtların salt okunur tutarlılık denetimi
        run: python audit_state.py --json
      - name: Hata varsa Telegram'a haber ver
        if: failure() && github.ref == 'refs/heads/main'
        env:
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          C: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: curl -s "https://api.telegram.org/bot$T/sendMessage" -d chat_id="$C" -d text="🆘 CLAUDE'A YAZ — Son kod değişikliği testten geçmedi. Bir sonraki video etkilenebilir; Claude'a 'kontrol et' yaz." >/dev/null

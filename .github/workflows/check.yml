name: İzin kontrolü
on:
  workflow_dispatch:
    inputs:
      ses_ornegi:
        description: "Telegram'a örnek Türkçe ses gönder"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q google-api-python-client google-auth requests numpy edge-tts
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SES_ORNEGI: ${{ inputs.ses_ornegi && '1' || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT2_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_PAID_API_KEY: ${{ secrets.GEMINI_PAID_API_KEY }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GD_IG_ACCESS_TOKEN: ${{ secrets.GD_IG_ACCESS_TOKEN }}
          GD_IG_USER_ID: ${{ secrets.GD_IG_USER_ID }}
        run: python check_tokens.py

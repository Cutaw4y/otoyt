name: OtoYT (Cutaway)

on:
  schedule:
    - cron: "31 4 * * 1,3,4"   # Pzt/Çar/Per 04:31 UTC (07:31 TR)
    - cron: "3 5 * * 1,3,4"    # yedek: GitHub zamanlayıcısı bazen atlıyor/geciktiriyor (bugün video çıktıysa 1 dk'da kapanır)
    - cron: "37 5 * * 1,3,4"   # ikinci yedek
  workflow_dispatch:            # "Run workflow" butonu = senin "Çalıştır" tuşun
    inputs:
      dry_run:
        description: "Test modu: video üret ama YouTube'a yükleme"
        type: boolean
        default: false
      force_new_video:
        description: "Bugün zaten video varsa BİLEREK ikinci video üret (normalde kapalı)"
        type: boolean
        default: false

permissions:
  contents: write               # history.json / assets_used.json kaydı için

concurrency: otoyt-uretim   # iki kanal ASLA aynı anda üretmez (Google görsel sınırı paylaşılıyor); biri bitince öbürü başlar

jobs:
  produce:
    runs-on: ubuntu-24.04   # sabit sürüm: Ubuntu 26 geçişinde paketler bozulmasın
    timeout-minutes: 330   # GitHub üst sınırı 360; yükleme sonrası adımlar kesilmesin
    steps:
      - name: Disk alanı aç (kullanılmayan araçlar silinir, ~30 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost; df -h / | tail -1
      - uses: actions/checkout@v4
        with: {ref: main}   # sırada bekleyen iş de en güncel kaydı görsün
      - name: Bugünün videosu zaten çıktı mı (çıktıysa 1 dk'da kapan, dakika harcama)
        if: github.event_name == 'schedule' && env.CATCHUP != '1'
        run: |
          python3 -c "import json,datetime,sys; d=datetime.datetime.utcnow().date().isoformat(); h=json.load(open('history.json')); sys.exit(0 if any(x.get('type','long')=='long' and str(x.get('date','')).startswith(d) for x in h) else 1)" && echo "SKIP=1" >> $GITHUB_ENV && echo "Bugünün videosu zaten çıktı, atlanıyor" || true
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
          cache: pip
      - name: Ses modeli önbelleği (her seferinde indirmesin)
        if: env.SKIP != '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ hashFiles('config.yaml') }}
          restore-keys: kokoro-
      - name: Bağımlılıklar
        if: env.SKIP != '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core espeak-ng
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt
      - name: Video üret ve yükle
        if: env.SKIP != '1'
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FORCE_NEW_VIDEO: ${{ inputs.force_new_video && '1' || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_PAID_API_KEY: ${{ secrets.GEMINI_PAID_API_KEY }}
          GEMINI_TTS_EXTRA_KEYS: ${{ secrets.GEMINI_TTS_EXTRA_KEYS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: |
          set +e
          OTOYT_ATTEMPT=1 python pipeline.py; code=$?
          if [ $code -eq 3 ]; then
            echo "Yükleme öncesi hata → 10 dk sonra yeniden deneniyor"; sleep 600
            OTOYT_ATTEMPT=2 python pipeline.py; code=$?
          fi
          # 3/4 = hata Telegram'a Türkçe bildirildi → GitHub ayrıca İngilizce "Run failed" e-postası atmasın
          if [ $code -eq 3 ] || [ $code -eq 4 ]; then echo "::error title=Üretim yapılamadı::Video üretilmedi veya tamamlanmadı, ayrıntı logs/last_run.txt"; exit "$code"; fi
          exit $code
      - name: Paket 1 – uzun video
        if: always() && hashFiles('out/ARTIFACT_NEEDED') != '' && env.SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}-1-uzun-video
          path: out/1-VIDEO-*.mp4
          if-no-files-found: ignore
          retention-days: 2
          compression-level: 0
      - name: Paket 2 – Shorts, küçük resim, altyazılar, yükleme bilgileri
        if: always() && hashFiles('out/ARTIFACT_NEEDED') != '' && env.SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}-2-shorts-ve-bilgiler
          path: |
            out/*
            !out/1-VIDEO-*.mp4
          if-no-files-found: ignore
          retention-days: 2
          compression-level: 0
      - name: Geçmişi kaydet
        if: always() && env.SKIP != '1'
        run: |
          python3 json_guard.py  # bozuk JSON veya Git çakışması asla git'e yazılmasın
          git config user.name "otoyt-bot"
          git config user.email "otoyt@users.noreply.github.com"
          for f in credit_ledger.json playlist_covers.json history.json assets_used.json assets/branding_done.json logs/last_run.txt \
                   pending_comments.json pending_script.json votes.json ig_queue.json playlists.json localizations_cleared.json manual_pending.json related_video_tasks.json; do [ -f "$f" ] && git add "$f"; done
          git add -A pending_script.json 2>/dev/null || true   # silindiyse silinmesi de kaydedilsin
          for d in pending_captions thumb_alt manual logs/archive; do [ -d "$d" ] && git add -A "$d"; done
          git diff --cached --quiet && exit 0
          git commit -m "otoyt: $(date -u +%F)"
          git stash -u -q || true
          # aynı anda repoya başka değişiklik gelmişse: çakışmada botun kayıtları geçerli olsun, 3 kez dene
          for i in 1 2 3; do
            git pull --rebase -X theirs -q && git push && exit 0
            git rebase --abort 2>/dev/null; sleep 5
          done
          exit 1

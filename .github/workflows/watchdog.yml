name: Bekçi (video çıkmadıysa otomatik yeniden dene)
on:
  schedule:
    - cron: "17 5-19 * * *"   # her saat: bugünün videosu çıkmadıysa ve üretim çalışmıyorsa başlatır
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: watchdog
jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}   # sırada bekleyen iş de en güncel kaydı görsün
      - run: pip install -q requests pyyaml
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watchdog.py
      - name: Kaydet
        run: |
          python3 json_guard.py  # bozuk JSON veya Git çakışması asla git'e yazılmasın
          git config user.name "otoyt-bot"; git config user.email "otoyt@users.noreply.github.com"
          git add watchdog_state.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "bekçi" && for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; sleep 5; done

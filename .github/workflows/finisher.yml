name: Elle yüklenenleri tamamla
on:
  schedule:
    - cron: "23 4,7,10,13,16,19 * * *"   # TR 07:23-22:23 arası 3 saatte bir
  workflow_dispatch:
    inputs:
      add_translation:
        description: "Çeviri altyazısı eklenecek video kimlikleri (virgülle). Boş = normal tamamlama"
        required: false
        default: ""
      retag:
        description: "Hashtag'leri yenilenecek video kimlikleri (virgülle). Boş = normal tamamlama"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: otoyt-uretim
  cancel-in-progress: false
  queue: max
jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}   # sırada bekleyen iş de en güncel kaydı görsün
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q requests pyyaml pillow numpy google-api-python-client google-auth
      - name: Tamamla
        env:
          FINISH_ONLY: "1"
          ADD_TRANSLATION: ${{ inputs.add_translation }}
          RETAG: ${{ inputs.retag }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT2_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_PAID_API_KEY: ${{ secrets.GEMINI_PAID_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        # iki kanal tek işte sırayla (GitHub her işi en az 1 dk sayar → aylık dakika yarıya iner)
        run: |
          status=0
          OTOYT_CONFIG=config.yaml python pipeline.py || { echo "::error::Beyond Qaf tamamlayıcı hata verdi"; status=1; }
          OTOYT_CONFIG=channels/golgedefter.yaml python pipeline.py || { echo "::error::Gölgedefter tamamlayıcı hata verdi"; status=1; }
          exit "$status"
      - name: Kaydet
        if: always()
        run: |
          python3 json_guard.py  # bozuk JSON veya Git çakışması asla git'e yazılmasın
          git config user.name "otoyt-bot"; git config user.email "otoyt@users.noreply.github.com"
          for f in playlist_covers.json history.json assets_used.json assets/branding_done.json pending_comments.json playlists.json \
                   votes.json localizations_cleared.json manual_pending.json related_video_tasks.json; do [ -f "$f" ] && git add "$f"; done
          for d in manual data/golgedefter pending_captions thumb_alt logs/archive; do [ -d "$d" ] && git add -A "$d"; done
          git diff --cached --quiet && exit 0
          git commit -q -m "tamamlayıcı"
          git stash -u -q || true   # kalan geçici değişiklikler pull'u engellemesin
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; git rebase --abort 2>/dev/null; sleep 5; done; exit 1

name: Hashtag yenile
on:
  workflow_dispatch:
    inputs:
      videos:
        description: "Video kimlikleri (virgülle)"
        required: true
      channel:
        description: "Kanal ayar dosyası"
        default: "channels/golgedefter.yaml"
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q requests pyyaml pillow numpy google-api-python-client google-auth
      - name: Yenile
        env:
          OTOYT_CONFIG: ${{ inputs.channel }}
          RETAG: ${{ inputs.videos }}
          PYTHONUNBUFFERED: "1"
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT2_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_PAID_API_KEY: ${{ secrets.GEMINI_PAID_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pipeline.py

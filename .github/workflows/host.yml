name: Anlatıcı karakter görselleri
on: workflow_dispatch
permissions:
  contents: write
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests google-auth pillow numpy
      - env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_PAID_API_KEY }}
        run: python make_host.py
      - run: |
          git config user.name "otoyt-bot"; git config user.email "otoyt@users.noreply.github.com"
          git add assets/golgedefter/host && git commit -qm "anlatıcı karakter adayları" && git pull --rebase -q && git push -q || true

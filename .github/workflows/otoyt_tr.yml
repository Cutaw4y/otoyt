name: OtoYT (Gölgedefter)
run-name: "gd-${{ inputs.editorial_job }}-${{ inputs.editorial_action }}"

on:
  schedule:
    - cron: "41 5 * * 0,2,5,6"   # Sal/Cuma/Cmt/Paz 05:41 UTC (08:41 TR) → video ~12:00 hazır (yayın 19:00, hafta sonu 16:00)
    - cron: "13 6 * * 0,2,5,6"   # yedek: GitHub zamanlayıcısı bazen atlıyor/geciktiriyor (bugün video çıktıysa 1 dk'da kapanır)
    - cron: "47 6 * * 0,2,5,6"   # ikinci yedek
  workflow_dispatch:            # "Run workflow" butonu = senin "Çalıştır" tuşun
    inputs:
      editorial_job:
        description: "Persisted Telegram job id (owner decisions required)"
        type: string
        default: ""
      editorial_action:
        description: "Telegram step"
        type: choice
        options: [produce, publish]
        default: produce
      dry_run:
        description: "Test modu: video üret ama YouTube'a yükleme"
        type: boolean
        default: false
      force_new_video:
        description: "Bugün zaten video varsa BİLEREK ikinci video üret (normalde kapalı)"
        type: boolean
        default: false

permissions:
  contents: write               # history.json / assets_used.json kaydı için

concurrency:
  group: otoyt-uretim
  cancel-in-progress: false
  queue: max

env:
  OTOYT_CONFIG: channels/golgedefter.yaml

jobs:
  produce:
    runs-on: ubuntu-24.04   # sabit sürüm: Ubuntu 26 geçişinde paketler bozulmasın
    timeout-minutes: 330   # GitHub üst sınırı 360; yükleme sonrası adımlar kesilmesin
    steps:
      - name: Disk alanı aç (kullanılmayan araçlar silinir, ~30 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost; df -h / | tail -1
      - uses: actions/checkout@v4
        with: {ref: main}   # sırada bekleyen iş de en güncel kaydı görsün
      - run: pip install -q requests pyyaml
      - name: Bugünün videosu zaten çıktı mı (çıktıysa 1 dk'da kapan)
        if: github.event_name == 'schedule'
        run: |
          python3 -c "import json,datetime,sys; d=datetime.datetime.utcnow().date().isoformat(); h=json.load(open('data/golgedefter/history.json')); sys.exit(0 if any(x.get('type','long')=='long' and str(x.get('date','')).startswith(d) for x in h) else 1)" && echo "SKIP=1" >> $GITHUB_ENV && echo "Bugünün videosu zaten çıktı, atlanıyor" || true
      - name: Telegram işi var mı
        if: inputs.editorial_job != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EDITORIAL_JOB: ${{ inputs.editorial_job }}
          EDITORIAL_ACTION: ${{ inputs.editorial_action }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python3 telegram_control.py --check-job
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
          cache: pip
      - name: Ses modeli önbelleği (her seferinde indirmesin)
        if: env.SKIP != '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ hashFiles('config.yaml') }}
          restore-keys: kokoro-
      - name: Sistem paketleri önbelleği (Ubuntu sunucusu yavaşsa beklemesin)
        if: env.SKIP != '1'
        uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-ffmpeg-espeak-v1
      - name: Bağımlılıklar
        if: env.SKIP != '1'
        run: |
          # 06.11: apt sunucusu 47 dk takıldı → önce önbellekteki paketler, olmazsa kısa zaman aşımıyla apt
          if ls ~/apt-debs/*.deb >/dev/null 2>&1 && sudo dpkg -i ~/apt-debs/*.deb >/dev/null 2>&1 \
             && command -v ffmpeg >/dev/null && command -v espeak-ng >/dev/null; then
            echo "Sistem paketleri önbellekten kuruldu"
          else
            A="-o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=5"
            sudo apt-get $A update -qq
            sudo apt-get $A install -y -qq --download-only ffmpeg fonts-dejavu-core espeak-ng
            mkdir -p ~/apt-debs && cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
            sudo apt-get $A install -y -qq ffmpeg fonts-dejavu-core espeak-ng
          fi
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt
      - name: Video üret ve yükle
        if: env.SKIP != '1'
        env:
          EDITORIAL_JOB: ${{ inputs.editorial_job }}
          EDITORIAL_ACTION: ${{ inputs.editorial_action }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FORCE_NEW_VIDEO: ${{ inputs.force_new_video && '1' || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_PAID_API_KEY: ${{ secrets.GEMINI_PAID_API_KEY }}
          GEMINI_TTS_EXTRA_KEYS: ${{ secrets.GEMINI_TTS_EXTRA_KEYS }}
          YT2_CLIENT_ID: ${{ secrets.YT2_CLIENT_ID }}
          YT2_CLIENT_SECRET: ${{ secrets.YT2_CLIENT_SECRET }}
          YT2_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.GD_IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.GD_IG_USER_ID }}
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: |
          set +e
          OTOYT_ATTEMPT=1 python pipeline.py; code=$?
          if [ $code -eq 3 ]; then
            echo "Yükleme öncesi hata → 10 dk sonra yeniden deneniyor"; sleep 600
            OTOYT_ATTEMPT=2 python pipeline.py; code=$?
          fi
          # 3/4 = hata Telegram'a Türkçe bildirildi → GitHub ayrıca İngilizce "Run failed" e-postası atmasın
          if [ $code -eq 3 ] || [ $code -eq 4 ]; then echo "::error title=Üretim yapılamadı::Video üretilmedi veya tamamlanmadı, ayrıntı data/golgedefter/logs/last_run.txt"; exit "$code"; fi
          exit $code
      - name: Paket 1 – uzun video
        if: always() && env.SKIP != '1' && hashFiles('out/ARTIFACT_NEEDED') != ''
        uses: actions/upload-artifact@v4
        with:
          name: golgedefter-${{ github.run_number }}-1-uzun-video
          path: out/1-VIDEO-*.mp4
          if-no-files-found: ignore
          retention-days: 2
          compression-level: 0
      - name: Paket 2 – Shorts, küçük resim, altyazılar, yükleme bilgileri
        if: always() && env.SKIP != '1' && hashFiles('out/ARTIFACT_NEEDED') != ''
        uses: actions/upload-artifact@v4
        with:
          name: golgedefter-${{ github.run_number }}-2-shorts-ve-bilgiler
          path: |
            out/*
            !out/1-VIDEO-*.mp4
          if-no-files-found: ignore
          retention-days: 2
          compression-level: 0
      - name: Geçmişi kaydet
        if: always() && env.SKIP != '1'
        run: |
          python3 json_guard.py  # bozuk JSON veya Git çakışması asla git'e yazılmasın
          git config user.name "otoyt-bot"
          git config user.email "otoyt@users.noreply.github.com"
          git add -A data/golgedefter
          [ -f credit_ledger.json ] && git add credit_ledger.json
          git diff --cached --quiet && exit 0
          git commit -m "golgedefter: $(date -u +%F)"
          git stash -u -q || true
          # aynı anda repoya başka değişiklik gelmişse: çakışmada botun kayıtları geçerli olsun, 3 kez dene
          for i in 1 2 3; do
            git pull --rebase -X theirs -q && git push && exit 0
            git rebase --abort 2>/dev/null; sleep 5
          done
          exit 1

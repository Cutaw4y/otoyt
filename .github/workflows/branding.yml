name: Kanal ayarları (açıklama, afiş)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  brand:
    runs-on: ubuntu-24.04
    strategy:
      max-parallel: 1
      matrix:
        config: [config.yaml, channels/golgedefter.yaml]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q requests pyyaml pillow numpy google-api-python-client google-auth
      - name: Kanal ayarlarını uygula
        env:
          BRANDING_ONLY: "1"
          OTOYT_CONFIG: ${{ matrix.config }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_PAID_API_KEY: ${{ secrets.GEMINI_PAID_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT2_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python pipeline.py
          grep -h "Kanal\|afiş\|HATA\|çeviri" logs/last_run.txt data/golgedefter/logs/last_run.txt 2>/dev/null | sed 's/^/::notice::/' || true
      - name: Kaydet
        run: |
          git config user.name "otoyt-bot"; git config user.email "otoyt@users.noreply.github.com"
          git add -A assets/branding_done.json localizations_cleared.json data/golgedefter 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "kanal ayarları" && { git stash -u -q || true; } && for i in 1 2 3; do git pull --rebase -X theirs -q && git push && exit 0; sleep 5; done

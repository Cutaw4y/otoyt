name: Instagram sırası (Beyond Qaf)

on:
  schedule:
    - cron: "17 13 * * *"      # her gün 13:17 UTC (ABD doğu sabah 08:17): sıradaki 1 Reel
  workflow_dispatch:

permissions:
  contents: write               # ig_queue.json / history.json kaydı + Release'teki videolar

concurrency: ig-beyondqaf

env:
  OTOYT_CONFIG: config.yaml

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}   # sırada bekleyen iş de en güncel kaydı görsün
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pyyaml
      - name: Sıradaki Reel'i paylaş
        env:
          GH_TOKEN: ${{ github.token }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ig_queue.py
      - name: Kaydet
        if: always()
        run: |
          git config user.name "otoyt-bot"
          git config user.email "otoyt@users.noreply.github.com"
          for f in ig_queue.json history.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "beyondqaf instagram: $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase -X theirs -q && git push && exit 0
            git rebase --abort 2>/dev/null; sleep 5
          done
          exit 1

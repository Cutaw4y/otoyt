# ======================= KALİTE =======================
target_words: 2200             # ~19-20 dk (03.11 izleyici yorumu: daha uzun ve dolu dolu olsun): Türkçe gizem kanallarında izleyici uzun belgesel seviyor (Gerçeği Bul ort. ~29 dk)
words_per_minute: 110          # Türkçe anlatım hızı (bildirimdeki tahmini süre için)
min_length_ratio: 0.85
max_expand_rounds: 2
min_diagram_ratio: 0.5         # sahnelerin en az yarısı atmosferik AI görseli
min_quality_score: 7
min_quality_floor: 5            # 06.11 (Claude+ChatGPT): editör bir başlıkta 5'in altı verirse yayınlanmaz, yeni konu denenir
# CUMA = uzun belgesel (kanal sahibi isteği 06.11): ~30-35 dk, daha çok görsel ve süre payı
weekday_overrides:
  4:
    target_words: 3600            # ölçüldü: 3400 kelime = 40 dk ses (06.11) → Cuma belgeseli ≥40 dk
    visual_time_budget_min: 60     # senaryo aşaması uzun sürüyor: 5,5 saat sınırına pay
    max_gemini_scene_images: 55
    max_expand_rounds: 3
    extra_script_rules: >
      CUMA BELGESELİ (uzun, sinematik belgesel tadında; LEMMiNO, Barely Sociable, Wendigoon, Hakikat Avcısı tarzı
      uzun anlatı kanallarının yöntemleri — metin/başlık KOPYALANMAZ):
      1) SOĞUK AÇILIŞ: ilk 40-60 saniyede olayın en ürpertici, belgeli anını sahne sahne anlat (yer, yıl, kişi),
      sonra "bu hikâye nasıl başladı?" diye geri dön. Selamlama/kanal tanıtımı yok.
      2) PERDELER: anlatıyı 6-8 bölüme (perde/dosya) ayır. Her bölüm küçük bir merak kancasıyla açılsın ve
      cevabı sonraki bölümde verilen açık bir soruyla bitsin (her 3-4 dakikada yeniden kanca).
      3) BİRİNCİL KAYNAK: arşiv kaydı, mahkeme/kadı sicili, seyyah notu, gazete haberi gibi kaynakları tarih ve
      yer vererek, yavaşça, alıntı tonunda aktar; hangi kaynağın ne kadar güvenilir olduğunu söyle.
      4) İNSAN ODAĞI: olayı yaşayan somut kişileri (köylü, kadı, doktor, tanık) takip et; onların gözünden anlat.
      5) ZAMAN VE MEKÂN ÇAPASI: tarihleri, yerleri ve mesafeleri sık ver; izleyici haritada nerede olduğunu bilsin.
      6) TEMPO: atmosferik, yavaş betimleme paragraflarını hızlı açıklama/ifşa paragraflarıyla değiştir;
      kritik cümleden önce kısa, tek cümlelik duraklar kullan.
      7) TEORİLER VE BİLİM: son üçte birde rasyonel/bilimsel açıklamaları (tıp, ayrışma, salgınlar, psikoloji)
      ve karşı görüşleri adil biçimde ver; hangisinin güçlü olduğunu kanıta göre tart.
      8) KAPANIŞ: "bugün kesin bilinenler / hâlâ bilinmeyenler" ayrımı, akılda kalan son bir görüntü ve
      izleyiciye tek bir tartışma sorusu. Uydurma kişi, alıntı, tarih veya belge YOK.
max_topic_attempts: 2          # fiyat/performans: en fazla 2 konu denenir, en iyi senaryo yayınlanır
selected_topic_attempts: 2      # ÜRET ile seçilen AYNI konu için 2 bağımsız senaryo denemesi; konu değiştirilmez
max_rewrites: 1                 # 06.11 maliyet: tek düzeltme turu (puan zaten 7-8)
units_rule: >
  Metrik birimler kullan (metre, kilometre, kilogram, derece). Her sayıyı göz önünde canlanan bir
  karşılaştırmayla ver ("yaklaşık kırk metre, on katlı bir apartman kadar").
plain_rules: >
  Türkçe ve sade yaz: Osmanlıca, Arapça ya da akademik kelimeleri (ör. "rivayet", "kavim", "ahir zaman",
  "tefsir", "hadis", "sur'a üflenmesi", "megalitik", "nekropol") ilk geçtiği yerde günlük dille açıkla:
  "hadis, yani Peygamberimizin sözleri olarak aktarılan anlatımlar". Uzun, iç içe cümle kurma; devrik ve
  süslü cümle yok. Her yer, kişi ve dönem için izleyicinin aklında resim oluşsun: "Mezopotamya, bugünkü
  Irak topraklarında, iki büyük nehrin arasındaki bölge".
max_factcheck_rounds: 2
require_web_factcheck: true
fallback_broll: "foggy forest night"
explore_rate: 0.25


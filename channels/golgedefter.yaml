seo_rules: >
  core_keyword: Türkiye'de insanların gerçekten yazdığı doğal arama kalıbı ("dyatlov geçidi
  olayı", "voynich el yazması sırrı", "alkarısı nedir"). Başlık doğal Türkçe merak kalıbıyla
  kurulsun: "gerçek hikayesi", "ne oldu", "neden hâlâ çözülemedi", "kimse bilmiyor",
  "perde arkası"; çeviri kokan kalıplar ve kelimesi kelimesine İngilizce yapılar yasak.
  Açıklamanın ilk iki satırı: videonun en can alıcı sorusu + anahtar kelime. Bölüm başlıkları
  izleyicinin ileri sararken merak edeceği, aranabilir ifadeler ("Olayın Başladığı Gece",
  "Kayıtlardaki Gizli Ayrıntı", "Bilim Ne Diyor"). Etiketler: anahtar kelime, alternatif
  yazılışlar, yabancı isimlerin yaygın yanlış yazımları, ilgili yer/kişi/olay adları
  (Türkçe karaktersiz yazılışları sistem otomatik ekler). Açıklamanın sonunda "Kaynaklar:" başlığıyla
  videoda geçen ayetleri (sure ve ayet numarası), hadis kaynaklarını ve belgeleri listele. pinned_comment: Türk izleyicinin
  yorum yazmayı sevdiği kişisel görüş sorusu, iki seçenekli ("Sizce gerçek açıklama hangisi:
  çığ mı, askerî deney mi?", "O gece siz orada olsaydınız çadırdan çıkar mıydınız?").
factcheck_note: >
  For Quran verses and hadiths: flag as WRONG any verse number, surah name or hadith
  source that does not match, and any quote presented as a verse or hadith that is not
  one. Eschatology claims must be attributed ("hadislerde anlatıldığına göre").
  This is a channel about legends and unexplained events. Do NOT flag a claim as
  wrong just because it describes a legend, belief or eyewitness account, as long
  as the script frames it as a story or claim ("anlatılana göre", "iddiaya göre").
  Flag as wrong: wrong dates, places, names, numbers, misattributed quotes, or a
  supernatural claim presented as proven fact.


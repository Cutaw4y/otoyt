  - id: temim-1
    pillar: "Kıyamet alametleri ve ahir zaman anlatıları (ayet ve hadis kaynaklarıyla, tarih tahmini yok)"
    title: "Deccal Bir Adada Zincirli mi? 30 Denizcinin Gördüğü Şey"
    search_query: "temim ed dari hadisi cessase deccal ada"
    angle: >
      Sahih-i Müslim'deki (Kitabü'l-Fiten, "Cessâse hadisi") rivayet: Fâtıma bint Kays'ın aktardığı, Peygamber
      Efendimiz'in (s.a.v.) minberden anlattığı Temîm ed-Dârî'nin deniz yolculuğu. Lahm ve Cüzâm kabilesinden 30
      kişi, bir ay dalgalarla savrulan gemi, ada, tüylü varlık Cessâse, manastırda zincirlenmiş adam ve onun
      sorduğu sorular (Beysan hurmaları, Taberiye gölü, Zuğar pınarı). Önce hadisin metnini ve kaynağını sadık
      biçimde anlat (kitap ve bab adıyla), sonra âlimlerin bu hadis hakkında söylediklerini (sened değerlendirmesi,
      farklı yorumlar) aktar. Adanın yeri hakkındaki popüler tahminleri "iddia" olarak ver, kesin konum ve tarih
      tahmini yapma, kimseyi Deccal ilan etme. Saygılı, sakin, belgesel anlatım.

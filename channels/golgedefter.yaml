  description: |
    📜 Açıklanamayanların defteri. Kayıp medeniyetlerden kutsal kıssalara, kıyamet anlatılarından tarihin çözülemeyen olaylarına uzanan belgesel bir yolculuk.
    🏺 Göbeklitepe'den Sümerlere, İrem şehrinden Zülkarneyn'in seddine; antik uygarlıklar, arkeolojik keşifler ve dünyanın en esrarengiz olayları.
    📖 Ayetler, hadis kaynakları, tarihî belgeler ve akademik araştırmalar ışığında: ne anlatılıyor, kayıtlar ne diyor, bilim ne açıklıyor, hâlâ ne bilinmiyor.
    🔎 Amacımız spekülasyon üretmek değil; bilgiye dayalı, düşündüren ve merak uyandıran sayfalar açmak.
    🕯 Yeni sayfalar her Salı, Perşembe ve Cumartesi. Kaçırmamak için abone olmayı unutmayın.
    Seslendirme yapay zekâ sesidir; her senaryo yayından önce kaynaklarla kontrol edilir.


# ======================= DOSYA YERLERİ =======================
data_dir: "data/golgedefter"           # geçmiş, kayıtlar, bekleyen altyazılar
assets_dir: "assets/golgedefter"       # intro / outro / müzik / logo (brand_golgedefter.py üretir)
logo_file: "golgedefter_logo.png"

# Bu kanal kendi YouTube iznini (YT2_*) ve ücretli Gemini anahtarını kullanır.
env_map:
  YT_CLIENT_ID: "YT2_CLIENT_ID"          # yoksa Cutaway'in uygulama kimliği kullanılır (aynı Google projesi olabilir)
  YT_CLIENT_SECRET: "YT2_CLIENT_SECRET"
  YT_REFRESH_TOKEN: "YT2_REFRESH_TOKEN"
  GEMINI_API_KEY: "GEMINI_PAID_API_KEY"
require_env: ["YT2_REFRESH_TOKEN", "GEMINI_PAID_API_KEY"]   # eksikse video YANLIŞ kanala gitmesin diye çalışma atlanır
paid_tier: false               # şimdilik ücretsiz katman (ayrı projenin kendi kotası); ödeme açılınca true

# ======================= MODELLER (ücretli Gemini anahtarı) =======================
text_models: ["gemini-flash-latest", "gemini-flash-lite-latest"]   # ücretli katmanda: gemini-pro-latest başa
judge_models: ["gemini-flash-lite-latest", "gemini-flash-latest"]
factcheck_models: ["gemini-flash-lite-latest", "gemini-flash-latest"]

voice:
  provider: "gemini"
  name: "Charon"               # derin, bilgilendirici erkek sesi. Alternatif: "Enceladus" (fısıltılı), "Algenib" (boğuk)
  style: "Türkçe, kısık ve sakin bir sesle, gizemli bir belgesel anlatıcısı gibi, acele etmeden ve cümle aralarında kısa duraklarla oku"
  sentence_gap: 0.33           # cümle arası en az 0.33 sn (belgesel ağırlığı)
  scenes_per_request: 6        # 6 sahne tek istekte → video başına ~6 ses isteği (ücretsiz günlük sınıra sığar)
  scene_gap: 0.6
  models: ["gemini-3.1-flash-tts-preview", "gemini-2.5-flash-preview-tts"]   # ikisi de ücretsiz katmanda çalışıyor (test edildi)
  lang: "tr"

# ======================= KURGU =======================
use_intro: true
outro_line: "Bu sayfa şimdilik kapanıyor. Gölgedefter'in bir sonraki sayfasında görüşmek üzere."
outro_hold_seconds: 8
shot_seconds: 5.0              # gizem temposu: biraz daha uzun çekimler
hook_scenes: 2
j_cut_seconds: 0.3
burn_captions: true
music_db: -20

# ======================= KALİTE =======================
target_words: 1700             # ~15-16 dk: Türkçe gizem kanallarında izleyici uzun belgesel seviyor (Gerçeği Bul ort. ~29 dk)
min_length_ratio: 0.85
max_expand_rounds: 2
min_diagram_ratio: 0.5         # sahnelerin en az yarısı atmosferik AI görseli
min_quality_score: 7
min_quality_floor: 0
max_topic_attempts: 5
max_rewrites: 2
units_rule: >
  Metrik birimler kullan (metre, kilometre, kilogram, derece). Her sayıyı göz önünde canlanan bir
  karşılaştırmayla ver ("yaklaşık kırk metre, on katlı bir apartman kadar").
plain_rules: >
  Türkçe ve sade yaz: Osmanlıca, Arapça ya da akademik kelimeleri (ör. "rivayet", "kavim", "ahir zaman",
  "tefsir", "hadis", "sur'a üflenmesi", "megalitik", "nekropol") ilk geçtiği yerde günlük dille açıkla:
  "hadis, yani Peygamberimizin sözleri olarak aktarılan anlatımlar". Uzun, iç içe cümle kurma; devrik ve
  süslü cümle yok. Her yer, kişi ve dönem için izleyicinin aklında resim oluşsun: "Mezopotamya, bugünkü
  Irak topraklarında, iki büyük nehrin arasındaki bölge".
max_factcheck_rounds: 2
require_web_factcheck: true
fallback_broll: "foggy forest night"
explore_rate: 0.25

# ======================= YAYIN =======================
uploader: "youtube"
category_id: "27"
publish_mode: "manual"         # API onayı gelene kadar: sistem üretir, sahibi Studio’dan elle yükler. Onaydan sonra "scheduled"
publish_delay_hours: 6
# Türkiye izleyicisi: hafta içi 19:00, hafta sonu 14:00; Shorts her akşam 20:30 (TR saati)
publish_slots: {tz: "Europe/Istanbul", times: {default: "19:00", sat: "14:00", sun: "14:00"}}
shorts_slots: {tz: "Europe/Istanbul", times: {default: "20:30"}}
min_lead_hours: 1.5
post_comment: true
ascii_tag_variants: true       # "gerçek hikayesi" + "gercek hikayesi"
# Başlık/açıklama yalnızca Türkçe (çeviri başlık eklenmez). Altyazı: Türkçe + İngilizce çeviri izi (CC'den açılır)
localize_metadata: false
subtitle_translation:
  code: "en"
  name: "English"
  label: "English"
  chapters_heading: "Chapters"
  desc_footer: "Stock footage: Pixabay / Pexels. Narration: AI voice. Legends and claims are presented with their sources; supernatural claims are not presented as proven fact."
  full_video_text: "Watch the full video:"

make_shorts: true
shorts_per_video: 3
shorts_delay_hours: 20
shorts_gap_hours: 20

instagram_enabled: true          # anahtar yoksa sessizce atlanır
instagram_reels_per_video: 1     # her videodan Instagram'a kaç Reel
instagram_ai_label: true

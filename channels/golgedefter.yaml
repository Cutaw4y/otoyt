# ======================= GÖLGEDEFTER (2. kanal, Türkçe) =======================
# Çalıştıran iş akışı: .github/workflows/otoyt_tr.yml  (OTOYT_CONFIG=channels/golgedefter.yaml)
channel_name: "Gölgedefter"
notify_prefix: "🕯 Gölgedefter |"
channel_brief: >
  Türkçe belgesel kanalı: kayıp medeniyetler ve antik gizemler, İslam tarihi ve
  kutsal kıssalar, kıyamet ve ahir zaman anlatıları, açıklanamayan gerçek olaylar,
  efsaneler ve "yasak bilgi" iddiaları. Her video TEK bir olayı, yeri, kavmi,
  kıssayı ya da belgeyi ele alır (ör. Göbeklitepe'nin gömülmesi, İrem şehri ve Ad
  kavmi, Zülkarneyn ve Ye'cüc Me'cüc seddi, Ashab-ı Kehf, Sümerlerin tufan tableti,
  Nazca çizgileri, Dyatlov Geçidi, Voynich El Yazması, Anadolu'nun alkarısı inancı). Önce anlatılanları
  hikâye gibi kurar, sonra kayıtlara, belgelere ve bilim insanlarının açıklamalarına
  geçer; sonunda neyin bilindiğini, neyin hâlâ bilinmediğini dürüstçe ayırır.
  Instagram marka etiketi: #gölgedefter
audience: "gizem, tarih ve efsane meraklısı 18-45 yaş Türkçe konuşan izleyiciler"
tone: "kısık sesli, sakin, gizemli bir belgesel anlatıcısı; ağırbaşlı, abartısız, merak uyandıran"
language: "Turkish"
language_code: "tr"
chapter_label: "BÖLÜM"
intro_chapter: "Giriş"
chapters_heading: "Bölümler"
caption_label: "Türkçe"
full_video_text: "Videonun tamamı:"
wiki_langs: ["tr", "en"]

script_rules: >
  Türkçe yaz; doğal, akıcı, kulağa hitap eden cümleler (çeviri kokan ifade yok).
  GİRİŞ (ilk 2-3 cümle): olayın en çarpıcı anını ya da en tuhaf ayrıntısını hemen
  göster, izleyici doğru videoya tıkladığını anlasın; selamlama yok, "bugünkü
  videoda" yok, "hiç düşündünüz mü" gibi klişeler yok. Yapı: olayın kendisi
  (yer, zaman, kim gördü) → anlatılanlar ve tanıklıklar → belgeler ve kayıtlar →
  öne sürülen açıklamalar (doğal, bilimsel, tarihsel) → hâlâ açıklanamayan kısım.
  Efsane, tanıklık ve inançları "anlatılana göre", "kayıtlara göre", "iddiaya göre"
  diye çerçevele; doğaüstü iddiaları kanıtlanmış gerçek gibi SUNMA, ama alay da etme.
  Dinler ve inançlar hakkında saygılı ve tarafsız ol: hiçbir dini, kutsal kişiyi ya
  da inananı küçümseme; peygamberleri tasvir etme; kutsal metinlerden ne anlatıldığını
  aktar, yorumu kaynağına bağla. Ayetleri sure adı ve ayet numarasıyla, hadisleri
  kaynak kitabıyla (Buhârî, Müslim gibi) ver; kaynağından emin olmadığın anlatımı
  "rivayet edilir" diye aktar, uydurma ayet ya da hadis asla yazma. Kıyamet için tarih
  tahmini yapma. Âlimler arasında farklı görüş varsa görüşleri tarafsız sırala.
  "Yasak bilgi", antik astronot gibi iddiaları iddia olarak anlat ve arkeolojinin ve
  bilimin cevabını mutlaka ver; spekülasyon üretme, bilgiye dayalı merak uyandır. Kan, vahşet, intihar ayrıntısı yok; ölümler
  ağırbaşlı ve kısa anlatılır. Yaşayan sıradan kişileri suçlama. Tarih ve sayılar
  emin değilse "yaklaşık", "kayıtlara göre" de. Sahne başına tek fikir; gerilimi
  sorularla taşı. İlk cümle başlığın ve küçük resmin vaat ettiğini hemen karşılasın (kandırmaca yok).
  Her 30-40 saniyede merakı tazeleyen küçük bir dönüş olsun ("Ama asıl tuhaflık burada başlıyor",
  yeni bir tanık, beklenmedik bir belge). İlk 15 saniyede yerel bir merak boşluğu aç ("Kimsenin fark etmediği
  o ayrıntı...", "Her şey o gece tek bir sesle başladı..."); olayın insani tarafını
  (korku, kayıp, inanç, cesaret) hissettir. Çeviri Türkçesi kullanma: gereksiz "bir"
  tekrarlarını sil ("bir adam bir gün bir karar verdi" değil "O gün adam kararını verdi").
  Rakam, sembol ve kısaltma bırakma; hepsini okunuşuyla yaz ("bin dokuz yüz elli dokuz",
  "yüzde kırk"). Yabancı isimleri doğru yazımıyla bırak (fonetik yazma, altyazıda görünür).
  Ölçüleri Türkiye'de kullanılana çevir: mil → kilometre, pound → kilogram, Fahrenheit →
  santigrat, feet → metre. Para tutarlarını somut bir kıyasla ver (ör. "o günün parasıyla
  bir köyün yıllık geliri kadar"). Sonda tek cümlelik bir kapanış düşüncesi olsun. Abone ol
  çağrısı veya veda cümlesi YAZMA: kanalın sabit kapanış cümlesi otomatik eklenir.
  BELGESEL YAPISI (türün en iyi kanallarının yöntemlerinden; taklit değil, yöntem):
  1) Soğuk açılış: olayın en tuhaf, en somut ayrıntısıyla başla ve hemen tarih + yer ver ("Şubat
  1959, Ural Dağları. Kurtarma ekibi çadırı buldu; çadır içeriden kesilmişti.").
  2) Zaman çizelgesi: olayı saat saat, gün gün kronolojik anlat; her kritik anda tarih/saat/yeri
  söyle ve o sahnenin callout'una kısa tarih-yer yaz ("2 Şubat 1959 · 21.00"). İzleyici hiç kaybolmasın.
  3) Önce kanıt, sonra yorum: "Kesin bilinenler" bölümünde yalnızca belgelenmiş gerçekler (resmi
  rapor, tanık ifadesi, fotoğraf, arkeolojik bulgu); söylentiyi ayrıca ve "iddiaya göre" diye ver.
  4) Yanlış bilinen bir ayrıntıyı düzelt: popüler anlatımlarda sık tekrarlanan ama kaynaklarda
  öyle olmayan EN AZ bir bilgiyi kaynağıyla düzelt ("Çoğu anlatımda X denir; oysa rapor Y diyor").
  Bu, videoyu diğerlerinden ayıran güven anıdır.
  5) Teoriler bölümü: 3-4 açıklamayı EN ZAYIFTAN EN GÜÇLÜYE sırala; her biri için en güçlü kanıtı
  ve onu zayıflatan noktayı adil biçimde ver. Doğaüstü/komplo teorilerini de alay etmeden tart.
  6) Değerlendirme: "Kanıtların en çok desteklediği açıklama…" diye net ama alçakgönüllü bir sonuç
  söyle; neyin hâlâ bilinmediğini açıkça belirt. Dini anlatılarda hüküm verme: kaynakların ve
  âlimlerin ne dediğini aktar.
  7) Kapanış: olayın bıraktığı iz (ne değişti, kurbanlar nasıl anılıyor) ve izleyiciye teoriler
  arasında seçim yaptıran tek soru (sabit yorumla aynı tartışma).
  Bölüm başlıkları bu yapıyı izlesin ("Çadırın Bulunduğu Sabah", "Kesin Bilinenler", "Yanlış
  Bilinen Ayrıntı", "Teoriler", "Kanıtlar Ne Diyor", "Hâlâ Bilinmeyen").
title_examples: >   # sahibinin beğendiği başlık tarzı (konu: somut kişi/sayı + yaptıkları + cevapsız soru)
  "Dyatlov Geçidi: 9 Dağcı O Gece Neden Çadırı İçeriden Kesip Kaçtı?" ·
  "Mary Celeste: 10 Kişi Sofrayı Kurup Gemiden Nasıl Kayboldu?" ·
  "Göbeklitepe: 12 Bin Yıl Önce Bu Taşları Kim, Neden Gömdü?"
saturation_views: 100000   # rakip analizi: bu izlenmenin üstündeki videolar 'büyük rakip' sayılır
seo_rules: >
  core_keyword: Türkiye'de insanların gerçekten yazdığı doğal arama kalıbı ("dyatlov geçidi
  olayı", "voynich el yazması sırrı", "alkarısı nedir"). Başlık doğal Türkçe merak kalıbıyla
  kurulsun: "gerçek hikayesi", "ne oldu", "neden hâlâ çözülemedi", "kimse bilmiyor",
  "perde arkası"; çeviri kokan kalıplar ve kelimesi kelimesine İngilizce yapılar yasak.
  Açıklamanın ilk iki satırı: videonun en can alıcı sorusu + anahtar kelime. Bölüm başlıkları
  izleyicinin ileri sararken merak edeceği, aranabilir ifadeler ("Olayın Başladığı Gece",
  "Kayıtlardaki Gizli Ayrıntı", "Bilim Ne Diyor"). Etiketler: anahtar kelime, alternatif
  yazılışlar, yabancı isimlerin yaygın yanlış yazımları, ilgili yer/kişi/olay adları
  (Türkçe karaktersiz yazılışları sistem otomatik ekler). Açıklamanın sonunda "Kaynaklar:" başlığıyla
  videoda geçen ayetleri (sure ve ayet numarası), hadis kaynaklarını ve belgeleri listele. pinned_comment: Türk izleyicinin
  yorum yazmayı sevdiği kişisel görüş sorusu, iki seçenekli ("Sizce gerçek açıklama hangisi:
  çığ mı, askerî deney mi?", "O gece siz orada olsaydınız çadırdan çıkar mıydınız?").
factcheck_note: >
  For Quran verses and hadiths: flag as WRONG any verse number, surah name or hadith
  source that does not match, and any quote presented as a verse or hadith that is not
  one. Eschatology claims must be attributed ("hadislerde anlatıldığına göre").
  This is a channel about legends and unexplained events. Do NOT flag a claim as
  wrong just because it describes a legend, belief or eyewitness account, as long
  as the script frames it as a story or claim ("anlatılana göre", "iddiaya göre").
  Flag as wrong: wrong dates, places, names, numbers, misattributed quotes, or a
  supernatural claim presented as proven fact.

